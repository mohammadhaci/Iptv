<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OwnTV Web — مشغّل IPTV</title>
<meta name="description" content="مشغّل IPTV ويب لاشتراكات Xtream — يعمل على الايفون">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OwnTV">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#07090d; --ink:#f2f5f8; --muted:#93a1ad; --hairline:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.10);
  --teal:#2dd4e6; --teal-deep:#0e7c8c; --danger:#ff6b6b; --gold:#ffd166;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --blur:saturate(180%) blur(22px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 520px at 85% -12%, rgba(45,212,230,.13), transparent 60%),
    radial-gradient(800px 460px at 8% -4%, rgba(99,102,241,.10), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button,input{font-family:inherit;font-size:inherit}
.hidden{display:none !important}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Login ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;padding-top:calc(28px + var(--safe-top))}
.login-card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--hairline);border-radius:26px;padding:34px 26px 28px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center}
#login img{width:76px;height:76px;border-radius:19px;margin-bottom:16px;box-shadow:0 18px 50px rgba(45,212,230,.3)}
#login h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
#login .sub{color:var(--muted);margin:6px 0 24px;font-size:.9rem}
.field{width:100%;margin-bottom:12px}
.field label{display:block;font-size:.78rem;color:var(--muted);margin:0 4px 6px}
.field input{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--hairline);border-radius:13px;color:var(--ink);
  padding:13px 14px;font-size:1rem;outline:none;direction:ltr;text-align:left;transition:border-color .15s ease, box-shadow .15s ease}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,230,.18)}
#loginBtn{width:100%;background:#fff;color:#0a0d12;font-weight:800;font-size:1.02rem;border:0;border-radius:999px;
  padding:14px;margin-top:10px;cursor:pointer;box-shadow:0 10px 30px rgba(255,255,255,.15);transition:transform .15s ease}
#loginBtn:active{transform:scale(.97)}
#loginBtn:disabled{opacity:.55}
#loginMsg{width:100%;margin-top:14px;font-size:.86rem;line-height:1.8;color:var(--danger);text-align:center;white-space:pre-line}
#advToggle{background:none;border:none;color:var(--muted);font-size:.8rem;margin-top:16px;cursor:pointer;text-decoration:underline}
#advBox{width:100%;margin-top:10px}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{position:relative;z-index:5;padding:calc(10px + var(--safe-top)) 16px 10px;display:flex;align-items:center;gap:11px;
  background:rgba(9,12,17,.66);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--hairline)}
header img{width:30px;height:30px;border-radius:8px}
header .title{font-weight:800;font-size:1.06rem;letter-spacing:.01em;flex:1}
header .title span{color:var(--teal)}
header button{background:var(--glass);border:1px solid var(--hairline);border-radius:999px;color:var(--ink);
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
header button:active{background:var(--glass-2)}
#searchBar{padding:10px 16px;background:rgba(9,12,17,.66);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--hairline)}
#searchInput{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--hairline);border-radius:12px;color:var(--ink);padding:10px 13px;outline:none}
#searchInput:focus{border-color:var(--teal)}

#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;flex:none;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--glass);border:1px solid var(--hairline);color:var(--muted);border-radius:999px;
  padding:8px 16px;font-size:.86rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s ease,color .15s ease}
.chip.active{background:#fff;border-color:#fff;color:#0a0d12;font-weight:800}

#content{flex:1;overflow-y:auto;padding:6px 16px calc(16px + var(--safe-bottom))}
#status{color:var(--muted);text-align:center;padding:44px 20px;line-height:2;white-space:pre-line;font-size:.92rem}

/* live rows */
.row{display:flex;align-items:center;gap:13px;background:var(--glass);border:1px solid var(--hairline);border-radius:16px;
  padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:background .15s ease}
.row:active{background:var(--glass-2)}
.row .logo{width:50px;height:50px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.row .logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.row .name{flex:1;font-size:.95rem;font-weight:600;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .fav{background:none;border:none;font-size:1.2rem;color:rgba(255,255,255,.35);padding:8px;cursor:pointer;flex:none}
.row .fav.on{color:var(--gold)}

/* posters grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:13px;padding-top:6px}
.poster{cursor:pointer;position:relative}
.poster .imgbox{aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.25);
  box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .16s ease}
.poster:active .imgbox{transform:scale(.96)}
.poster .imgbox .icon{width:34px;height:34px}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .pname{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:7px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.poster .fav{position:absolute;top:7px;left:7px;background:rgba(7,9,13,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--hairline);border-radius:10px;font-size:.95rem;color:rgba(255,255,255,.45);padding:4px 8px;cursor:pointer}
.poster .fav.on{color:var(--gold)}

/* skeleton shimmer */
@keyframes shimmer{0%{background-position:180% 0}100%{background-position:-20% 0}}
.skel{position:relative;border-radius:16px;border:1px solid var(--hairline);
  background:linear-gradient(100deg,rgba(255,255,255,.04) 40%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.04) 60%);
  background-size:200% 100%;animation:shimmer 1.4s infinite linear}
.skel-row{height:72px;margin-bottom:9px}
.skel-poster{aspect-ratio:2/3;border-radius:14px}
.skel-chip{width:86px;height:35px;border-radius:999px;flex:none}

/* section headers (favorites / seasons) */
.season{color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.14em;margin:20px 4px 10px;text-transform:uppercase}
.season b{color:var(--teal)}

/* bottom nav */
nav{display:flex;background:rgba(9,12,17,.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--hairline);padding:6px 8px calc(6px + var(--safe-bottom));flex:none}
nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.42);padding:7px 4px 5px;font-size:.7rem;font-weight:700;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px;transition:color .15s ease}
nav button .icon{width:23px;height:23px}
nav button.active{color:var(--teal)}

/* ---------- Player overlay ---------- */
#player{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#playerBar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-top)) 14px 12px;
  background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
#playerBar .ptitle{flex:1;font-size:.94rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#playerBar button{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--hairline);border-radius:999px;color:#fff;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#video{flex:1;width:100%;background:#000;object-fit:contain}
#playerMsg{color:var(--muted);text-align:center;padding:12px;font-size:.86rem;white-space:pre-line}

/* ---------- Episodes overlay ---------- */
#episodes{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
#epBar{display:flex;align-items:center;gap:11px;padding:calc(10px + var(--safe-top)) 14px 12px;
  background:rgba(9,12,17,.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--hairline)}
#epBar .ptitle{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#epBar button{background:var(--glass);border:1px solid var(--hairline);border-radius:999px;color:var(--ink);
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#epList{flex:1;overflow-y:auto;padding:14px 16px calc(16px + var(--safe-bottom))}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="i-tv"><rect x="2" y="4" width="20" height="13" rx="2.5"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
    <g id="i-film"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M8 3v18"/><path d="M16 3v18"/><path d="M3 9h5"/><path d="M3 15h5"/><path d="M16 9h5"/><path d="M16 15h5"/></g>
    <g id="i-series"><rect x="3" y="7" width="18" height="14" rx="2.5"/><path d="M7 3.5 12 7l5-3.5"/><path d="m10 11 5 3-5 3z"/></g>
    <g id="i-star"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></g>
    <g id="i-power"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></g>
    <g id="i-close"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></g>
  </defs>
</svg>

<!-- Login -->
<div id="login">
  <div class="login-card">
    <img src="icons/icon-512.png" alt="OwnTV">
    <h1>OwnTV <span style="color:var(--teal)">Web</span></h1>
    <div class="sub">سجّل الدخول ببيانات اشتراك Xtream</div>
    <div class="field"><label>رابط السيرفر (مع المنفذ)</label><input id="inServer" type="url" placeholder="http://example.com:8080" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>اسم المستخدم</label><input id="inUser" type="text" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>كلمة المرور</label><input id="inPass" type="password"></div>
    <button id="loginBtn">دخول</button>
    <div id="loginMsg"></div>
    <button id="advToggle">إعدادات متقدمة</button>
    <div id="advBox" class="hidden">
      <div class="field"><label>بروكسي CORS (اختياري — اتركه فارغًا عادةً)</label><input id="inProxy" type="url" placeholder="https://my-proxy.example.com/?url="></div>
    </div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <img src="icons/icon-192.png" alt="">
    <div class="title">OwnTV <span>Web</span></div>
    <button id="btnSearch" title="بحث"><svg class="icon" viewBox="0 0 24 24"><use href="#i-search"/></svg></button>
    <button id="btnLogout" title="خروج"><svg class="icon" viewBox="0 0 24 24"><use href="#i-power"/></svg></button>
  </header>
  <div id="searchBar" class="hidden"><input id="searchInput" type="search" placeholder="ابحث بالقائمة الحالية…"></div>
  <div id="cats"></div>
  <div id="content"><div id="status">جارِ التحميل…</div></div>
  <nav>
    <button data-tab="live" class="active"><svg class="icon" viewBox="0 0 24 24"><use href="#i-tv"/></svg>مباشر</button>
    <button data-tab="vod"><svg class="icon" viewBox="0 0 24 24"><use href="#i-film"/></svg>أفلام</button>
    <button data-tab="series"><svg class="icon" viewBox="0 0 24 24"><use href="#i-series"/></svg>مسلسلات</button>
    <button data-tab="fav"><svg class="icon" viewBox="0 0 24 24"><use href="#i-star"/></svg>المفضلة</button>
  </nav>
</div>

<!-- Episodes overlay -->
<div id="episodes" class="hidden">
  <div id="epBar"><button id="epClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button><div class="ptitle" id="epTitle"></div></div>
  <div id="epList"></div>
</div>

<!-- Player overlay -->
<div id="player" class="hidden">
  <div id="playerBar"><button id="playerClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button><div class="ptitle" id="playerTitle"></div></div>
  <video id="video" controls playsinline autoplay></video>
  <div id="playerMsg" class="hidden"></div>
</div>

<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
