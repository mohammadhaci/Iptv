<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OwnTV Web — مشغّل IPTV</title>
<meta name="description" content="مشغّل IPTV ويب لاشتراكات Xtream — يعمل على الايفون">
<meta name="theme-color" content="#0d161e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OwnTV">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0d161e; --card:#13202b; --card2:#182835; --line:#1f3242;
  --teal:#26c6da; --teal-dark:#1a99aa; --text:#eaf2f7; --muted:#8fa6b5;
  --danger:#ef5350; --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;overscroll-behavior:none}
button,input{font-family:inherit;font-size:inherit}
.hidden{display:none !important}

/* ---------- Login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + var(--safe-top))}
#login img{width:84px;height:84px;border-radius:20px;margin-bottom:14px;box-shadow:0 8px 40px rgba(38,198,218,.25)}
#login h1{font-size:1.5rem;margin-bottom:4px}
#login .sub{color:var(--muted);margin-bottom:26px;font-size:.95rem}
.field{width:100%;max-width:380px;margin-bottom:14px}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;font-size:1rem;outline:none;direction:ltr;text-align:left}
.field input:focus{border-color:var(--teal)}
#loginBtn{width:100%;max-width:380px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#04252b;font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:14px;margin-top:8px;cursor:pointer}
#loginBtn:disabled{opacity:.6}
#loginMsg{max-width:380px;width:100%;margin-top:14px;font-size:.88rem;line-height:1.8;color:var(--danger);text-align:center;white-space:pre-line}
#advToggle{background:none;border:none;color:var(--muted);font-size:.83rem;margin-top:16px;cursor:pointer;text-decoration:underline}
#advBox{width:100%;max-width:380px;margin-top:10px}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{padding:calc(10px + var(--safe-top)) 14px 10px;display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line)}
header img{width:32px;height:32px;border-radius:8px}
header .title{font-weight:700;font-size:1.05rem;flex:1}
header button{background:none;border:none;color:var(--muted);font-size:1.25rem;padding:6px;cursor:pointer}
#searchBar{padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
#searchInput{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 12px;outline:none}
#cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--bg);flex:none;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.86rem;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--teal);border-color:var(--teal);color:#04252b;font-weight:700}
#content{flex:1;overflow-y:auto;padding:6px 14px calc(14px + var(--safe-bottom))}
#status{color:var(--muted);text-align:center;padding:36px 20px;line-height:1.9;white-space:pre-line}

/* live rows */
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#0a1219;flex:none}
.row .name{flex:1;font-size:.95rem;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .fav{background:none;border:none;font-size:1.15rem;color:var(--muted);padding:6px;cursor:pointer;flex:none}
.row .fav.on{color:#ffd54f}

/* posters grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding-top:4px}
.poster{cursor:pointer;position:relative}
.poster .imgbox{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.6rem}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .pname{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.poster .fav{position:absolute;top:6px;left:6px;background:rgba(10,18,25,.75);border:none;border-radius:8px;font-size:.95rem;color:var(--muted);padding:4px 7px;cursor:pointer}
.poster .fav.on{color:#ffd54f}

/* bottom nav */
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);flex:none}
nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 8px;font-size:.75rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ico{font-size:1.25rem}
nav button.active{color:var(--teal)}

/* ---------- Player overlay ---------- */
#player{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#playerBar{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-top)) 12px 8px;background:rgba(10,15,20,.85)}
#playerBar .ptitle{flex:1;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#playerBar button{background:none;border:none;color:#fff;font-size:1.3rem;padding:6px;cursor:pointer}
#video{flex:1;width:100%;background:#000;object-fit:contain}
#playerMsg{color:var(--muted);text-align:center;padding:10px;font-size:.85rem;white-space:pre-line}

/* ---------- Episodes overlay ---------- */
#episodes{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
#epBar{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-top)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
#epBar .ptitle{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#epBar button{background:none;border:none;color:var(--text);font-size:1.3rem;padding:6px;cursor:pointer}
#epList{flex:1;overflow-y:auto;padding:12px 14px calc(14px + var(--safe-bottom))}
.season{color:var(--teal);font-size:.9rem;font-weight:700;margin:14px 2px 8px}
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <img src="icons/icon-512.png" alt="OwnTV">
  <h1>OwnTV Web</h1>
  <div class="sub">سجّل الدخول ببيانات اشتراك Xtream</div>
  <div class="field"><label>رابط السيرفر (مع المنفذ)</label><input id="inServer" type="url" placeholder="http://example.com:8080" autocapitalize="off" autocorrect="off"></div>
  <div class="field"><label>اسم المستخدم</label><input id="inUser" type="text" autocapitalize="off" autocorrect="off"></div>
  <div class="field"><label>كلمة المرور</label><input id="inPass" type="password"></div>
  <button id="loginBtn">دخول</button>
  <div id="loginMsg"></div>
  <button id="advToggle">إعدادات متقدمة</button>
  <div id="advBox" class="hidden">
    <div class="field"><label>بروكسي CORS (اختياري — اتركه فارغًا عادةً)</label><input id="inProxy" type="url" placeholder="https://my-proxy.example.com/?url="></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <img src="icons/icon-192.png" alt="">
    <div class="title">OwnTV</div>
    <button id="btnSearch" title="بحث">🔍</button>
    <button id="btnLogout" title="خروج">⏻</button>
  </header>
  <div id="searchBar" class="hidden"><input id="searchInput" type="search" placeholder="ابحث بالقائمة الحالية…"></div>
  <div id="cats"></div>
  <div id="content"><div id="status">جارِ التحميل…</div></div>
  <nav>
    <button data-tab="live" class="active"><span class="ico">📺</span>مباشر</button>
    <button data-tab="vod"><span class="ico">🎬</span>أفلام</button>
    <button data-tab="series"><span class="ico">🎞️</span>مسلسلات</button>
    <button data-tab="fav"><span class="ico">⭐</span>المفضلة</button>
  </nav>
</div>

<!-- Episodes overlay -->
<div id="episodes" class="hidden">
  <div id="epBar"><button id="epClose">✕</button><div class="ptitle" id="epTitle"></div></div>
  <div id="epList"></div>
</div>

<!-- Player overlay -->
<div id="player" class="hidden">
  <div id="playerBar"><button id="playerClose">✕</button><div class="ptitle" id="playerTitle"></div></div>
  <video id="video" controls playsinline autoplay></video>
  <div id="playerMsg" class="hidden"></div>
</div>

<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
