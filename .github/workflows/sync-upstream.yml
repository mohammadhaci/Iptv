# MANUAL-ONLY upstream sync. This app has intentionally diverged from ahXN00/OwnTV
# (own UI styling, own release line) — nothing is pulled automatically anymore.
# If you ever want to bring in upstream changes, run this from the Actions tab and
# be ready to resolve conflicts with our UI customizations.
name: Sync upstream (manual)

on:
  workflow_dispatch:

permissions:
  contents: write   # push the merge commit
  actions: write    # dispatch android.yml after a sync

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream ahXN00/OwnTV
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ahXN00/OwnTV.git
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Merge conflict with upstream ahXN00/OwnTV — fetch and merge manually to resolve."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "Already up to date with upstream."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # --repo is required: the checkout has an "upstream" remote, which gh would
      # otherwise resolve as the target repo (403 on dispatch).
      - name: Build the updated APK
        if: steps.merge.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
