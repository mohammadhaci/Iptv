# Publishes site/ (download landing page + OwnTV Web PWA) to the gh-pages branch,
# which GitHub Pages serves at https://mohammadhaci.github.io/Iptv/
# Runs on pushes to the default branch that touch site/, and on demand.
name: Deploy site

on:
  push:
    branches: [ "claude/iptv-player-fire-tv-jnjwkn" ]
    paths: [ "site/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "Deploy site"
